version: 2
updates:
  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend panel dependencies (lit runtime + the rollup/vitest toolchain).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Python test/tooling dependencies declared as pip requirement files.
  # Runtime requirements are declared in the Home Assistant manifest and are
  # tracked separately from Dependabot's pip file discovery.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
